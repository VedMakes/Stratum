name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[stratum,test]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Smoke-test imports and tool registration
        run: >-
          python -c "import MLProj, stratum; import stratum.data.contracts,
          stratum.data.drift, stratum.data.profiler, stratum.data.splitter;
          from stratum.mcp_server import ALL_TOOLS, HANDLERS, create_server;
          create_server(); assert {tool['name'] for tool in ALL_TOOLS} == set(HANDLERS)"

      - name: Smoke-test MCP command
        run: |
          stratum-mcp --help
          stratum-mcp --version
          stratum --help

      - name: Run tests
        run: python -m pytest
